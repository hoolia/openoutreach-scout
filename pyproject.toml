[project]
name = "oo-scout"
version = "0.1.0"
description = "Read-only LinkedIn scout on OpenOutreach linkedin_cli: human pacing, signals to ClickHouse."
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
dependencies = [
  # linkedin_cli (fetched from upstream at the pinned commit) needs these four
  "playwright==1.65.2",
  "playwright-stealth==2.0.3",
  "termcolor==3.3.0",
  "tenacity==9.2.1",
  # the adapter
  "httpx==0.28.1",
  "pyyaml==6.0.4",
  "tzdata==2026.6",
]

[project.optional-dependencies]
test = [
  "pytest==9.2.0",
  "respx==0.23.1",
]

[project.scripts]
oo-scout = "oo_scout.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oo_scout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["upstream", "src"]
